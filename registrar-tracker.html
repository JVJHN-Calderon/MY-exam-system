<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrar Document Request Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Registrar Document Request Tracker</h1>
  <nav>
    <button class="tab-btn active" data-tab="request">Send Request</button>
    <button class="tab-btn" data-tab="status">Check Status</button>
    <button class="tab-btn" data-tab="registrar">Registrar</button>
    <button class="tab-btn" data-tab="summary">Summary</button>
  </nav>
</header>
<div id="msg" role="alert"></div>
<main>
  <section id="request" class="tab active">
    <h2>Send a Request</h2>
    <form id="requestForm" novalidate>
      <label>Student name <input id="name" type="text" placeholder="Juan Dela Cruz"></label>
      <label>Student ID <input id="studentId" type="text" placeholder="e.g. 2023-00123"></label>
      <label>Course <input id="course" type="text" placeholder="e.g. BSIT"></label>
      <label>Document type
        <select id="docType"><option value="">-- Choose --</option></select>
      </label>
      <p id="feeInfo" class="info"></p>
      <label>Purpose <input id="purpose" type="text" placeholder="e.g. Scholarship application"></label>
      <button type="submit">Submit Request</button>
    </form>
  </section>

  <section id="status" class="tab">
    <h2>Check Request Status</h2>
    <form id="lookupForm" novalidate>
      <label>Reference number <input id="refInput" type="text" placeholder="REQ-2026-0001"></label>
      <button type="submit">Check</button>
    </form>
    <div id="lookupResult"></div>
  </section>

  <section id="registrar" class="tab">
    <h2>All Requests</h2>
    <div class="filters">
      <input id="search" type="text" placeholder="Search name, student ID, or reference no.">
      <select id="fStatus"><option value="">All statuses</option></select>
      <select id="fDoc"><option value="">All document types</option></select>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>Ref No.</th><th>Name</th><th>Student ID</th><th>Course</th><th>Document</th><th>Purpose</th><th>Requested</th><th>Status</th><th>Expected Release</th><th>Claimed</th><th>Action</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <section id="summary" class="tab">
    <h2>Summary</h2>
    <div class="cols"><div><h3>Per status</h3><table id="sumStatus"></table></div>
    <div><h3>Per document type</h3><table id="sumDoc"></table></div></div>
  </section>
</main>
<script src="js/app.js"></script>
</body>
</html>
